server:
  port: 8141

spring:
  application:
    name: wms-system
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wms_warehouse?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    # V1.1 F-09：口令不提供默认值，缺配置即启动失败；本地开发值由 cloud-up.sh 注入
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.wms_warehouse.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  ip-region:
    enabled: true
    offline: true
    api: http://ip-api.com/json/{ip}?lang=zh-CN
    timeout-ms: 3000

logging:
  level:
    com.wms_warehouse: info

auth:
  session-hours: 24
